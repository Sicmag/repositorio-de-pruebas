<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luci | FINNEX</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --navy: #102d46;
  --teal: #13b99a;
  --background: #f3f7fa;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  padding: 20px;
  display: flex;
  justify-content: center;
  align-items: center;
  background: var(--background);
  font-family: Inter, sans-serif;
}

.assistant {
  width: 100%;
  max-width: 480px;
  min-height: 650px;
  background: white;
  border-radius: 30px;
  box-shadow: 0 25px 80px rgba(16,45,70,.12);
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow: hidden;
}

.header {
  width: 100%;
  padding: 25px 30px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #edf1f4;
}

.brand {
  color: var(--navy);
  font-size: 23px;
  font-weight: 800;
}

.brand span {
  color: var(--teal);
}

.header-status {
  font-size: 10px;
  font-weight: 700;
  color: #16a085;
  letter-spacing: 1px;
}

.main {
  flex: 1;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 30px 20px;
}

.robot-container {
  width: 260px;
  height: 260px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  margin-bottom: 20px;
}

.orbit {
  position: absolute;
  width: 245px;
  height: 245px;
  border: 1px solid rgba(19,185,154,.2);
  border-radius: 50%;
}

.orbit::before {
  content: "";
  position: absolute;
  top: 30px;
  right: 25px;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--teal);
  box-shadow: 0 0 15px var(--teal);
}

.glow {
  position: absolute;
  width: 190px;
  height: 190px;
  border-radius: 50%;
  background: rgba(19,185,154,.13);
  filter: blur(30px);
}

.robot {
  position: relative;
  z-index: 2;
  width: 175px;
  height: 175px;
  border-radius: 48px;
  background: linear-gradient(145deg,#173d5b,#0b243a);
  display: flex;
  justify-content: center;
  align-items: center;
  box-shadow: 0 25px 45px rgba(16,45,70,.25);
  animation: float 4s ease-in-out infinite;
}

.robot-face {
  width: 130px;
  height: 100px;
  border-radius: 35px;
  background: linear-gradient(145deg,#dffff8,#a5f2df);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 17px;
}

.eyes {
  display: flex;
  gap: 32px;
}

.eye {
  width: 13px;
  height: 18px;
  border-radius: 50%;
  background: #123b52;
}

.mouth {
  width: 25px;
  height: 8px;
  border-bottom: 4px solid #123b52;
  border-radius: 50%;
}

.ear {
  position: absolute;
  width: 13px;
  height: 42px;
  top: 67px;
  background: var(--teal);
  border-radius: 8px;
}

.ear.left { left: -8px; }
.ear.right { right: -8px; }

.robot.listening,
.robot.speaking {
  animation: pulseRobot .8s ease-in-out infinite alternate;
}

.robot.speaking .mouth {
  animation: mouthMove .25s infinite alternate;
}

@keyframes float {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-9px); }
}

@keyframes pulseRobot {
  to { transform: scale(1.06); }
}

@keyframes mouthMove {
  to { height: 16px; }
}

.name {
  color: var(--navy);
  font-size: 34px;
  font-weight: 800;
  margin-bottom: 8px;
}

.subtitle {
  color: #8293a1;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 2px;
  margin-bottom: 28px;
}

.status {
  color: #526879;
  font-size: 14px;
  text-align: center;
  line-height: 1.5;
  min-height: 22px;
  max-width: 90%;
}

.status.error {
  color: #d64545;
}

.controls {
  width: 100%;
  padding: 25px;
  display: flex;
  justify-content: center;
  border-top: 1px solid #edf1f4;
}

.mic-button {
  width: 82px;
  height: 82px;
  border: none;
  border-radius: 50%;
  background: linear-gradient(145deg,#19c9a7,#079d83);
  color: white;
  font-size: 32px;
  cursor: pointer;
  box-shadow: 0 12px 30px rgba(19,185,154,.3);
  transition: .25s;
}

.mic-button:hover {
  transform: scale(1.06);
}

.mic-button:disabled {
  opacity: .55;
  cursor: not-allowed;
}

.mic-button.listening {
  background: #e74c3c;
  animation: micPulse 1.2s infinite;
}

@keyframes micPulse {
  0% { box-shadow: 0 0 0 0 rgba(231,76,60,.4); }
  70% { box-shadow: 0 0 0 22px rgba(231,76,60,0); }
  100% { box-shadow: 0 0 0 0 rgba(231,76,60,0); }
}

.footer {
  color: #a0adb8;
  font-size: 10px;
  letter-spacing: 2px;
  padding-bottom: 18px;
  font-weight: 700;
}

@media(max-width:480px) {
  .assistant { min-height: 90vh; }
  .robot-container { transform: scale(.9); }
}
</style>
</head>

<body>

<div class="assistant">

  <header class="header">
    <div class="brand">FINNEX<span>.</span></div>
    <div class="header-status">● LUCI ACTIVA</div>
  </header>

  <main class="main">

    <div class="robot-container">
      <div class="orbit"></div>
      <div class="glow"></div>

      <div class="robot" id="voiceRobot">
        <div class="ear left"></div>
        <div class="ear right"></div>

        <div class="robot-face">
          <div class="eyes">
            <div class="eye"></div>
            <div class="eye"></div>
          </div>
          <div class="mouth"></div>
        </div>
      </div>
    </div>

    <div class="name">Luci</div>
    <div class="subtitle">INTELIGENCIA ARTIFICIAL FINNEX</div>

    <div class="status" id="voiceText">
      Presiona el micrófono para hablar conmigo.
    </div>

  </main>

  <div class="controls">
    <button class="mic-button" id="micBtn" aria-label="Hablar con Luci">
      🎙
    </button>
  </div>

  <footer class="footer">FINNEX BANKING ECOSYSTEM</footer>

</div>

<script>
// ==========================================
// CONFIGURACIÓN GROQ
// ==========================================

// Pega aquí tu clave de Groq.
const GROQ_API_KEY = "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";

const GROQ_URL = "https://api.groq.com/openai/v1/chat/completions";
const GROQ_MODEL = "openai/gpt-oss-120b";

// ==========================================
// CONFIGURACIÓN ELEVENLABS + SUPABASE
// ==========================================

// Pega aquí tu clave de ElevenLabs.
const ELEVENLABS_API_KEY = "sk_5300dfc1d1b4d05acaa37432532f1e20c53a3b365e245629";

const ELEVENLABS_VOICE_ID = "EXAVITQu4vr4xnSDxMaL";
const ELEVENLABS_MODEL = "eleven_multilingual_v2";

const ELEVENLABS_URL =
  `https://api.elevenlabs.io/v1/text-to-speech/${ELEVENLABS_VOICE_ID}?output_format=mp3_44100_128`;

// ==========================================
// ELEMENTOS Y ESTADO
// ==========================================

const $ = id => document.getElementById(id);

const micBtn = $("micBtn");
const voiceText = $("voiceText");
const robot = $("voiceRobot");

let recognition = null;
let isListening = false;
let isBusy = false;
let history = [];
let audioToken = 0;

// ==========================================
// CONOCIMIENTO FINNEX
// ==========================================

const FINNEX_INFO = `
FINNEX es un ecosistema bancario digital colombiano.

PRODUCTOS:

NEXA: cuenta de ahorros para administrar dinero,
recibir fondos, transferencias y consultar movimientos.

NexusPagos: pagos, recargas, transferencias y servicios.

NexusCard: tarjeta débito y gestión de su estado.

NexusSave: herramientas de ahorro.
VELA permite crear bolsillos y metas de ahorro.
NEXT permite programar ahorros.
NexusBox permite organizar dinero en cajitas.

NexusInvest: ecosistema de inversión.
NEXO: producto de inversión tipo CDT.

NexusCredit: microcrédito, leasing, factoring y créditos
de consumo, educación y emergencia.

NexusShield: servicios de seguros y protección.

NexusBusiness: soluciones financieras para negocios.
NEXAR: financiación productiva.
NexusAnalytics: análisis financiero.

FINNEX Activos Circulares: compra y alquiler de equipos
reacondicionados.

TRÁMITES:
Certificados bancarios, extractos, reposición de tarjetas,
paz y salvo, solicitudes de crédito, simulación de crédito,
metas de ahorro, actualización de datos y soporte.
`;

// ==========================================
// PROMPT DE LUCI
// ==========================================

function crearMensajes(pregunta) {

  const systemPrompt = `
Eres Luci, la asistente virtual de FINNEX.

Tu función es ayudar exclusivamente con los productos,
cuentas, tarjetas, pagos, transferencias, ahorro,
inversiones, créditos y servicios de FINNEX.

REGLAS:

1. Responde siempre en español colombiano.
2. Sé amable, natural y concisa.
3. Responde en máximo tres oraciones.
4. Solo contestas preguntas relacionadas con FINNEX.
5. Si preguntan algo ajeno a FINNEX, responde:
"Solo puedo ayudarte con temas de FINNEX, como tus
productos, cuentas y servicios bancarios. ¿Qué necesitas?"
6. Nunca inventes tasas, costos, límites o requisitos.
7. No afirmes conocer saldos o movimientos sin consultar
un servicio bancario autenticado.
8. Nunca solicites contraseñas, PIN ni códigos de seguridad.
9. No afirmes que realizaste operaciones bancarias.
10. La información de referencia es:

${FINNEX_INFO}
`;

  return [
    { role: "system", content: systemPrompt },
    ...history.slice(-8),
    { role: "user", content: pregunta }
  ];
}

// ==========================================
// GROQ
// ==========================================

async function preguntarGroq(pregunta) {

  if (
    !GROQ_API_KEY ||
    GROQ_API_KEY.includes("PEGA_AQUI")
  ) {
    throw new Error("Debes colocar tu clave de Groq en el código.");
  }

  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 30000);

  try {

    const response = await fetch(GROQ_URL, {
      method: "POST",

      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${GROQ_API_KEY}`
      },

      body: JSON.stringify({
        model: GROQ_MODEL,
        messages: crearMensajes(pregunta),
        temperature: 0.3,
        reasoning_effort: "low",
        max_completion_tokens: 1024
      }),

      signal: controller.signal
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data?.error?.message || `Groq HTTP ${response.status}`
      );
    }

    const respuesta =
      data?.choices?.[0]?.message?.content?.trim();

    if (!respuesta) {
      throw new Error("Groq devolvió una respuesta vacía.");
    }

    history.push(
      { role: "user", content: pregunta },
      { role: "assistant", content: respuesta }
    );

    history = history.slice(-12);

    return respuesta;

  } catch (error) {

    if (error.name === "AbortError") {
      throw new Error("Groq tardó demasiado en responder.");
    }

    throw error;

  } finally {
    clearTimeout(timeout);
  }
}

// ==========================================
// ELEVENLABS - GENERACIÓN DE VOZ NATURAL
// ==========================================

let audioActual = null;
let audioActualURL = null;

// Generar audio llamando directamente a ElevenLabs
async function generarAudio(texto) {

  if (
    !ELEVENLABS_API_KEY ||
    ELEVENLABS_API_KEY === "PEGA_AQUI_TU_CLAVE_ELEVENLABS"
  ) {
    throw new Error("Falta configurar la clave de ElevenLabs.");
  }

  const controller = new AbortController();

  const timeout = setTimeout(() => {
    controller.abort();
  }, 45000);

  try {

    const response = await fetch(ELEVENLABS_URL, {

      method: "POST",

      headers: {
        "Content-Type": "application/json",
        "Accept": "audio/mpeg",
        "xi-api-key": ELEVENLABS_API_KEY
      },

      body: JSON.stringify({
        text: texto,
        model_id: ELEVENLABS_MODEL,
        voice_settings: {
          stability: 0.5,
          similarity_boost: 0.75
        }
      }),

      signal: controller.signal

    });

    if (!response.ok) {
      const errorText = await response.text();

      throw new Error(
        `ElevenLabs HTTP ${response.status}: ${errorText}`
      );
    }

    const blob = await response.blob();

    if (!blob.type.startsWith("audio/") || blob.size < 1000) {
      throw new Error("ElevenLabs no devolvió un audio válido.");
    }

    return blob;

  } catch (error) {

    if (error.name === "AbortError") {
      throw new Error("ElevenLabs tardó demasiado en responder.");
    }

    throw error;

  } finally {

    clearTimeout(timeout);

  }
}

// ==========================================
// VOZ DE RESPALDO DEL NAVEGADOR
// ==========================================

function hablarConNavegador(texto) {

  return new Promise((resolve, reject) => {

    if (!window.speechSynthesis) {
      reject(new Error("El navegador no admite reproducción de voz."));
      return;
    }

    window.speechSynthesis.cancel();

    const token = ++audioToken;
    const utterance = new SpeechSynthesisUtterance(texto);

    utterance.lang = "es-CO";
    utterance.rate = 1;
    utterance.pitch = 1;
    utterance.volume = 1;

    utterance.onstart = () => {
      robot.classList.add("speaking");
      voiceText.textContent = "Luci está respondiendo...";
    };

    utterance.onend = () => {
      if (token === audioToken) {
        robot.classList.remove("speaking");
        resolve();
      }
    };

    utterance.onerror = event => {

      robot.classList.remove("speaking");

      if (event.error === "canceled") {
        resolve();
      } else {
        reject(new Error("No se pudo reproducir la voz de respaldo."));
      }

    };

    window.speechSynthesis.speak(utterance);

  });

}

// ==========================================
// RESPUESTA DE VOZ (ElevenLabs + respaldo)
// ==========================================

async function hablar(texto) {

  robot.classList.remove("listening");
  robot.classList.add("speaking");

  voiceText.textContent = "Luci está preparando su respuesta...";

  try {

    // Detener cualquier audio anterior
    if (audioActual) {
      audioActual.pause();
      audioActual = null;
    }

    if (audioActualURL) {
      URL.revokeObjectURL(audioActualURL);
      audioActualURL = null;
    }

    if (window.speechSynthesis) {
      window.speechSynthesis.cancel();
    }

    // Solicitar voz natural a ElevenLabs
    const blob = await generarAudio(texto);

    audioActualURL = URL.createObjectURL(blob);

    audioActual = new Audio(audioActualURL);

    audioActual.volume = 1;

    voiceText.textContent = "Luci está hablando...";

    await new Promise((resolve, reject) => {

      audioActual.onended = resolve;

      audioActual.onerror = () => {
        reject(new Error("No se pudo reproducir el audio."));
      };

      audioActual.play().catch(reject);

    });

    voiceText.textContent = "Puedes volver a hablar conmigo.";

  } catch (error) {

    console.error("ERROR ELEVENLABS:", error);

    voiceText.textContent =
      "Usando voz alternativa...";

    // Si ElevenLabs falla, utilizar la voz del navegador
    await hablarConNavegador(texto);

    voiceText.textContent =
      "Puedes volver a hablar conmigo.";

  } finally {

    robot.classList.remove("speaking");

    if (audioActualURL) {
      URL.revokeObjectURL(audioActualURL);
      audioActualURL = null;
    }

    audioActual = null;

  }

}

// ==========================================
// PROCESAR PREGUNTA
// ==========================================

async function procesarPregunta(pregunta) {

  if (isBusy) return;

  isBusy = true;
  micBtn.disabled = true;

  try {

    voiceText.classList.remove("error");
    voiceText.textContent = "Luci está pensando...";

    const respuesta = await preguntarGroq(pregunta);

    voiceText.textContent = respuesta;

    await hablar(respuesta);

  } catch (error) {

    console.error("Error Luci:", error);

    voiceText.textContent = error.message;
    voiceText.classList.add("error");

  } finally {

    isBusy = false;
    micBtn.disabled = false;

  }
}

// ==========================================
// MICRÓFONO
// ==========================================

function resetEscucha() {

  isListening = false;

  micBtn.classList.remove("listening");
  robot.classList.remove("listening");

}

function iniciarEscucha() {

  if (isListening || isBusy) return;

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    voiceText.textContent =
      "Tu navegador no admite reconocimiento de voz. Utiliza Chrome o Edge.";
    voiceText.classList.add("error");
    return;
  }

  if (
    window.speechSynthesis &&
    window.speechSynthesis.speaking
  ) {
    window.speechSynthesis.cancel();
  }

  recognition = new SpeechRecognition();

  recognition.lang = "es-CO";
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  let huboResultado = false;

  recognition.onstart = () => {

    isListening = true;

    micBtn.classList.add("listening");
    robot.classList.add("listening");

    voiceText.classList.remove("error");
    voiceText.textContent = "Te estoy escuchando...";

  };

  recognition.onresult = event => {

    huboResultado = true;

    const pregunta =
      event.results[0][0].transcript.trim();

    resetEscucha();

    if (!pregunta) {
      voiceText.textContent = "No pude entenderte. Intenta otra vez.";
      return;
    }

    procesarPregunta(pregunta);

  };

  recognition.onerror = event => {

    const errors = {
      "not-allowed": "Permite el acceso al micrófono en el navegador.",
      "no-speech": "No te escuché. Intenta nuevamente.",
      "audio-capture": "No se encontró un micrófono disponible.",
      "network": "Error de red al reconocer tu voz.",
      "aborted": "Se canceló la escucha."
    };

    voiceText.textContent =
      errors[event.error] || `Error de micrófono: ${event.error}`;

    voiceText.classList.add("error");

    resetEscucha();

  };

  recognition.onend = () => {

    resetEscucha();

    if (
      !huboResultado &&
      voiceText.textContent === "Te estoy escuchando..."
    ) {
      voiceText.textContent = "No te escuché. Intenta nuevamente.";
    }

  };

  try {

    recognition.start();

  } catch (error) {

    console.error(error);
    resetEscucha();

    voiceText.textContent = "No se pudo iniciar el micrófono.";
    voiceText.classList.add("error");

  }

}

// ==========================================
// EVENTO DEL BOTÓN
// ==========================================

micBtn.addEventListener("click", iniciarEscucha);

</script>
</body>
</html>
