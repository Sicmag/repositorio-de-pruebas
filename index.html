<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prueba Voz ElevenLabs - FINNEX</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root { --wine: #6A0D2E; --wine-dark: #3E0721; --gold: #D4AF37; --bone: #F4F1EE; --white: #FFFFFF; --red: #EF4444; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: var(--wine-dark); display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .chat-window { width: 380px; height: 550px; background: var(--white); border-radius: 32px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
    .chat-header { background: linear-gradient(135deg, var(--wine) 0%, var(--wine-dark) 100%); color: white; padding: 20px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--gold); }
    .chat-header-name { font-size: 16px; font-weight: 800; }
    .chat-header-status { font-size: 12px; color: var(--gold); display: flex; align-items: center; gap: 4px; }
    .chat-header-status::before { content: ''; width: 8px; height: 8px; background: #10B981; border-radius: 50%; }
    .voice-assistant-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--bone); padding: 24px; text-align: center; position: relative; overflow: hidden; }
    .voice-robot-container { position: relative; width: 180px; height: 180px; display: flex; align-items: center; justify-content: center; margin-bottom: 24px; }
    .voice-robot { font-size: 100px; z-index: 2; transition: transform 0.3s ease; }
    .voice-robot.listening, .voice-robot.speaking { animation: pulse-robot 1s infinite alternate; }
    @keyframes pulse-robot { from { transform: scale(1); } to { transform: scale(1.1); } }
    .voice-waves { position: absolute; inset: 0; border-radius: 50%; background: var(--wine); opacity: 0; z-index: 1; transition: opacity 0.3s; }
    .voice-waves.active { opacity: 0.15; animation: ripple 1.5s infinite ease-out; }
    @keyframes ripple { 0% { transform: scale(0.8); opacity: 0.5; } 100% { transform: scale(1.5); opacity: 0; } }
    .voice-text { font-size: 15px; font-weight: 600; color: var(--wine); line-height: 1.5; max-width: 95%; min-height: 80px; max-height: 140px; z-index: 3; overflow-y: auto; }
    .voice-controls { padding: 24px; background: var(--white); display: flex; justify-content: center; border-top: 1px solid #eee; }
    .mic-btn { width: 72px; height: 72px; border-radius: 50%; background: var(--wine); color: white; border: none; font-size: 32px; cursor: pointer; box-shadow: 0 10px 25px rgba(106, 13, 46, 0.3); transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; }
    .mic-btn:hover { transform: scale(1.05); background: var(--wine-dark); }
    .mic-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .mic-btn.listening { background: var(--red); animation: pulse-mic 1s infinite; }
    @keyframes pulse-mic { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5); } 70% { box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
    .err { color: #dc2626; font-size: 12px; word-break: break-all; font-weight: 600; }
    .warn { color: #b45309; font-size: 11px; word-break: break-all; font-weight: 600; }
  </style>
</head>
<body>

  <div class="chat-window">
    <div class="chat-header">
      <div>
        <div class="chat-header-name" id="asistenteNombre">Luci (IA de Voz)</div>
        <div class="chat-header-status">Conectada</div>
      </div>
    </div>

    <div class="voice-assistant-area">
      <div class="voice-robot-container">
        <div class="voice-robot" id="voiceRobot">🤖</div>
        <div class="voice-waves" id="voiceWaves"></div>
      </div>
      <div class="voice-text" id="voiceText">Presiona el micrófono y pregúntame sobre finanzas.</div>
    </div>

    <div class="voice-controls">
      <button class="mic-btn" id="micBtn" onclick="iniciarEscucha()">🎤</button>
    </div>
  </div>

  <!-- config.js debe estar en la MISMA carpeta que este archivo -->
  <script src="config.js"></script>

  <script>
    const $ = (id) => document.getElementById(id);

    let recognition = null;
    let isListening = false;
    let isBusy = false;
    let audioActual = null;

    const TIMEOUT_IA_MS = 25000;
    const TIMEOUT_VOZ_MS = 25000;

    // ---------- Mostrar errores SIEMPRE en pantalla ----------
    function mostrarError(msg) {
      const el = $('voiceText');
      el.textContent = '';
      const s = document.createElement('span');
      s.className = 'err';
      s.textContent = msg;
      el.appendChild(s);
    }

    window.addEventListener('error', (e) => {
      console.error(e.error || e.message);
      mostrarError('Error: ' + (e.message || 'desconocido'));
      setBusy(false);
    });
    window.addEventListener('unhandledrejection', (e) => {
      console.error(e.reason);
      mostrarError('Error: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
      setBusy(false);
    });

    // ---------- Validar config.js ----------
    function configOK() {
      if (typeof CONFIG === 'undefined') {
        mostrarError('No se cargó config.js. Ponlo en la misma carpeta que este HTML y revisa que se llame exactamente config.js.');
        return false;
      }
      const faltan = ['GROQ_API_KEY', 'URL_GROQ', 'MODELO_GROQ', 'SUPABASE_URL', 'SUPABASE_ANON_KEY']
        .filter(k => !CONFIG[k]);
      if (faltan.length) {
        mostrarError('Faltan valores en config.js: ' + faltan.join(', '));
        return false;
      }
      return true;
    }

    // Valores seguros aunque config.js falle
    const NOMBRE = () => (typeof CONFIG !== 'undefined' && CONFIG.ASISTENTE_NOMBRE) || 'Luci';
    const ROL = () => (typeof CONFIG !== 'undefined' && CONFIG.ASISTENTE_ROL) || 'asistente virtual de FinNex';

    if (typeof CONFIG !== 'undefined') {
      $('asistenteNombre').textContent = `${NOMBRE()} (IA de Voz)`;
      if (CONFIG.ASISTENTE_SALUDO) $('voiceText').textContent = CONFIG.ASISTENTE_SALUDO;
    } else {
      configOK(); // muestra el aviso
    }

    function setBusy(v) {
      isBusy = v;
      $('micBtn').disabled = v;
    }

    // fetch con límite de tiempo (evita que se quede colgado para siempre)
    async function fetchConTimeout(url, opciones, ms, etiqueta) {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), ms);
      try {
        return await fetch(url, { ...opciones, signal: ctrl.signal });
      } catch (e) {
        if (e.name === 'AbortError') throw new Error(`${etiqueta} tardó más de ${ms / 1000}s sin responder.`);
        throw new Error(`${etiqueta}: no se pudo conectar (${e.message}). Revisa internet, la URL o CORS.`);
      } finally {
        clearTimeout(t);
      }
    }

    // ---------- Micrófono ----------
    function iniciarEscucha() {
      if (isListening || isBusy) return;
      if (!configOK()) return;

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("Tu navegador no soporta reconocimiento de voz. Usa Chrome o Edge.");
        return;
      }

      if (audioActual) { audioActual.pause(); audioActual = null; }
      if (window.speechSynthesis) window.speechSynthesis.cancel();

      recognition = new SpeechRecognition();
      recognition.lang = 'es-CO';
      recognition.continuous = false;
      recognition.interimResults = false;

      let huboResultado = false;

      recognition.onstart = () => {
        isListening = true;
        $('micBtn').classList.add('listening');
        $('voiceRobot').classList.add('listening');
        $('voiceWaves').classList.add('active');
        $('voiceText').textContent = "Te estoy escuchando...";
      };

      recognition.onresult = (event) => {
        huboResultado = true;
        const textoUsuario = event.results[0][0].transcript;
        $('voiceText').textContent = `Tú: "${textoUsuario}"`;
        // setTimeout evita que un error dentro del evento de voz lo deje mudo
        setTimeout(() => {
          procesarPreguntaIA(textoUsuario).catch((e) => {
            console.error(e);
            mostrarError('Error: ' + e.message);
            setBusy(false);
          });
        }, 0);
      };

      recognition.onerror = (event) => {
        const msg = event.error === 'not-allowed'
          ? "Permiso de micrófono denegado. Actívalo en el navegador (y usa localhost o https)."
          : event.error === 'no-speech'
            ? "No te escuché. Intenta de nuevo."
            : `No pude escucharte (${event.error}). Revisa el micrófono.`;
        mostrarError(msg);
      };

      recognition.onend = () => {
        resetUIEscucha();
        if (!huboResultado && $('voiceText').textContent === "Te estoy escuchando...") {
          $('voiceText').textContent = "No te escuché. Intenta de nuevo.";
        }
      };

      recognition.start();
    }

    function resetUIEscucha() {
      isListening = false;
      $('micBtn').classList.remove('listening');
      $('voiceRobot').classList.remove('listening');
      $('voiceWaves').classList.remove('active');
    }

    // ---------- Groq (texto) ----------
    async function preguntarGroq(pregunta) {
      const res = await fetchConTimeout(CONFIG.URL_GROQ, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${CONFIG.GROQ_API_KEY}`
        },
        body: JSON.stringify({
          model: CONFIG.MODELO_GROQ,
          messages: [
            {
              role: 'system',
              content: `Eres ${NOMBRE()}, ${ROL()}. Responde siempre en español, en máximo 2 oraciones, sin emojis, sin listas ni formato markdown, porque tu respuesta se leerá en voz alta.`
            },
            { role: 'user', content: pregunta }
          ],
          temperature: 0.6,
          max_completion_tokens: 800,
          reasoning_effort: 'low'
        })
      }, TIMEOUT_IA_MS, 'Groq');

      if (!res.ok) {
        let detalle = await res.text();
        if (res.status === 401) detalle = 'API key de Groq inválida o revocada. Actualiza GROQ_API_KEY en config.js. ' + detalle;
        if (res.status === 429) detalle = 'Límite de uso de Groq alcanzado. Espera un momento. ' + detalle;
        throw new Error(`Groq HTTP ${res.status}: ${detalle}`);
      }

      const data = await res.json();
      const texto = (data?.choices?.[0]?.message?.content || '').trim();
      if (!texto) throw new Error("Groq devolvió una respuesta vacía.");
      return texto;
    }

    // ---------- ElevenLabs vía Supabase Edge Function ----------
    async function generarAudio(texto) {
      const url = `${CONFIG.SUPABASE_URL}/functions/v1/elevenlabs-tts`;

      const res = await fetchConTimeout(url, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': CONFIG.SUPABASE_ANON_KEY,
          'Authorization': `Bearer ${CONFIG.SUPABASE_ANON_KEY}`
        },
        body: JSON.stringify({ text: texto, voice_id: "EXAVITQu4vr4xnSDxMaL" })
      }, TIMEOUT_VOZ_MS, 'Supabase/ElevenLabs');

      if (!res.ok) {
        throw new Error(`Supabase HTTP ${res.status}: ${await res.text()}`);
      }
      const blob = await res.blob();
      if (!blob.type.startsWith('audio') && blob.size < 1000) {
        throw new Error('La función no devolvió audio: ' + (await blob.text()));
      }
      return blob;
    }

    // Plan B: voz del navegador si ElevenLabs falla
    function hablarConNavegador(texto) {
      if (!window.speechSynthesis) return;
      const u = new SpeechSynthesisUtterance(texto);
      u.lang = 'es-CO';
      window.speechSynthesis.speak(u);
    }

    // ---------- Flujo principal ----------
    async function procesarPreguntaIA(pregunta) {
      setBusy(true);
      try {
        $('voiceText').textContent = `${NOMBRE()} está pensando...`;

        // 1) Texto con Groq
        let respuestaIA;
        try {
          respuestaIA = await preguntarGroq(pregunta);
        } catch (e) {
          console.error("ERROR GROQ:", e);
          mostrarError('Error IA: ' + e.message);
          return;
        }
        $('voiceText').textContent = respuestaIA;

        // 2) Voz con ElevenLabs (si falla, usa la del navegador)
        try {
          const blob = await generarAudio(respuestaIA);
          const url = URL.createObjectURL(blob);
          audioActual = new Audio(url);
          $('voiceRobot').classList.add('speaking');
          audioActual.onended = () => {
            $('voiceRobot').classList.remove('speaking');
            URL.revokeObjectURL(url);
          };
          audioActual.onerror = () => $('voiceRobot').classList.remove('speaking');
          await audioActual.play();
        } catch (e) {
          console.error("ERROR VOZ:", e);
          $('voiceRobot').classList.remove('speaking');
          const el = $('voiceText');
          el.textContent = respuestaIA;
          const aviso = document.createElement('div');
          aviso.className = 'warn';
          aviso.textContent = `(ElevenLabs falló: ${e.message})`;
          el.appendChild(aviso);
          hablarConNavegador(respuestaIA);
        }
      } finally {
        setBusy(false);
      }
    }
  </script>
</body>
</html>
