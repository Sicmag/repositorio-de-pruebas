async function preguntarGroq(pregunta) {

  if (
    !GROQ_API_KEY ||
    GROQ_API_KEY.includes("PEGA_AQUI")
  ) {
    throw new Error("Debes colocar tu clave de Groq en el código.");
  }

  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 30000);

  try {

    const response = await fetch(GROQ_URL, {
      method: "POST",

      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${GROQ_API_KEY}`
      },

      body: JSON.stringify({
        model: GROQ_MODEL,
        messages: crearMensajes(pregunta),
        temperature: 0.3,
        reasoning_effort: "low",
        max_completion_tokens: 1024
      }),

      signal: controller.signal
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data?.error?.message || `Groq HTTP ${response.status}`
      );
    }

    const respuesta =
      data?.choices?.[0]?.message?.content?.trim();

    if (!respuesta) {
      throw new Error("Groq devolvió una respuesta vacía.");
    }

    history.push(
      { role: "user", content: pregunta },
      { role: "assistant", content: respuesta }
    );

    history = history.slice(-12);

    return respuesta;

  } catch (error) {

    if (error.name === "AbortError") {
      throw new Error("Groq tardó demasiado en responder.");
    }

    throw error;

  } finally {
    clearTimeout(timeout);
  }
}

// Generar audio llamando directamente a ElevenLabs
async function generarAudio(texto) {

  if (
    !ELEVENLABS_API_KEY ||
    ELEVENLABS_API_KEY === "PEGA_AQUI_TU_CLAVE_ELEVENLABS"
  ) {
    throw new Error("Falta configurar la clave de ElevenLabs.");
  }

  const controller = new AbortController();

  const timeout = setTimeout(() => {
    controller.abort();
  }, 45000);

  try {

    const response = await fetch(ELEVENLABS_URL, {

      method: "POST",

      headers: {
        "Content-Type": "application/json",
        "Accept": "audio/mpeg",
        "xi-api-key": ELEVENLABS_API_KEY
      },

      body: JSON.stringify({
        text: texto,
        model_id: ELEVENLABS_MODEL,
        voice_settings: {
          stability: 0.5,
          similarity_boost: 0.75
        }
      }),

      signal: controller.signal

    });

    if (!response.ok) {
      const errorText = await response.text();

      throw new Error(
        `ElevenLabs HTTP ${response.status}: ${errorText}`
      );
    }

    const blob = await response.blob();

    if (!blob.type.startsWith("audio/") || blob.size < 1000) {
      throw new Error("ElevenLabs no devolvió un audio válido.");
    }

    return blob;

  } catch (error) {

    if (error.name === "AbortError") {
      throw new Error("ElevenLabs tardó demasiado en responder.");
    }

    throw error;

  } finally {

    clearTimeout(timeout);

  }
}

    window.speechSynthesis.cancel();

    const token = ++audioToken;
    const utterance = new SpeechSynthesisUtterance(texto);

    utterance.lang = "es-CO";
    utterance.rate = 1;
    utterance.pitch = 1;
    utterance.volume = 1;

    utterance.onstart = () => {
      robot.classList.add("speaking");
      voiceText.textContent = "Luci está respondiendo...";
    };

    utterance.onend = () => {
      if (token === audioToken) {
        robot.classList.remove("speaking");
        resolve();
      }
    };

    utterance.onerror = event => {

      robot.classList.remove("speaking");

      if (event.error === "canceled") {
        resolve();
      } else {
        reject(new Error("No se pudo reproducir la voz de respaldo."));
      }

    };

    window.speechSynthesis.speak(utterance);

  });

}

// ==========================================
// RESPUESTA DE VOZ (ElevenLabs + respaldo)
// ==========================================

async function hablar(texto) {

  robot.classList.remove("listening");
  robot.classList.add("speaking");

  voiceText.textContent = "Luci está preparando su respuesta...";

  try {

    // Detener cualquier audio anterior
    if (audioActual) {
      audioActual.pause();
      audioActual = null;
    }

    if (audioActualURL) {
      URL.revokeObjectURL(audioActualURL);
      audioActualURL = null;
    }

    if (window.speechSynthesis) {
      window.speechSynthesis.cancel();
    }

    // Solicitar voz natural a ElevenLabs
    const blob = await generarAudio(texto);

    audioActualURL = URL.createObjectURL(blob);

    audioActual = new Audio(audioActualURL);

    audioActual.volume = 1;

    voiceText.textContent = "Luci está hablando...";

    await new Promise((resolve, reject) => {

      audioActual.onended = resolve;

      audioActual.onerror = () => {
        reject(new Error("No se pudo reproducir el audio."));
      };

      audioActual.play().catch(reject);

    });

    voiceText.textContent = "Puedes volver a hablar conmigo.";

  } catch (error) {

    console.error("ERROR ELEVENLABS:", error);

    const motivo = error.message;

    voiceText.textContent =
      "Usando voz alternativa...";

    // Si ElevenLabs falla, utilizar la voz del navegador
    await hablarConNavegador(texto);

    // Mostrar el motivo real para poder corregirlo
    voiceText.textContent =
      "Voz alternativa usada. Motivo: " + motivo;
    voiceText.classList.add("error");

  } finally {

    robot.classList.remove("speaking");

    if (audioActualURL) {
      URL.revokeObjectURL(audioActualURL);
      audioActualURL = null;
    }

    audioActual = null;

  }

}

// ==========================================
// PROCESAR PREGUNTA
// ==========================================

async function procesarPregunta(pregunta) {

  if (isBusy) return;

  isBusy = true;
  micBtn.disabled = true;

  try {

    voiceText.classList.remove("error");
    voiceText.textContent = "Luci está pensando...";

    const respuesta = await preguntarGroq(pregunta);

    voiceText.textContent = respuesta;

    await hablar(respuesta);

  } catch (error) {

    console.error("Error Luci:", error);

    voiceText.textContent = error.message;
    voiceText.classList.add("error");

  } finally {

    isBusy = false;
    micBtn.disabled = false;

  }
}

// ==========================================
// MICRÓFONO
// ==========================================

function resetEscucha() {

  isListening = false;

  micBtn.classList.remove("listening");
  robot.classList.remove("listening");

}

function iniciarEscucha() {

  if (isListening || isBusy) return;

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    voiceText.textContent =
      "Tu navegador no admite reconocimiento de voz. Utiliza Chrome o Edge.";
    voiceText.classList.add("error");
    return;
  }

  if (
    window.speechSynthesis &&
    window.speechSynthesis.speaking
  ) {
    window.speechSynthesis.cancel();
  }

  recognition = new SpeechRecognition();

  recognition.lang = "es-CO";
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  let huboResultado = false;

  recognition.onstart = () => {

    isListening = true;

    micBtn.classList.add("listening");
    robot.classList.add("listening");

    voiceText.classList.remove("error");
    voiceText.textContent = "Te estoy escuchando...";

  };

  recognition.onresult = event => {

    huboResultado = true;

    const pregunta =
      event.results[0][0].transcript.trim();

    resetEscucha();

    if (!pregunta) {
      voiceText.textContent = "No pude entenderte. Intenta otra vez.";
      return;
    }

    procesarPregunta(pregunta);

  };

  recognition.onerror = event => {

    const errors = {
      "not-allowed": "Permite el acceso al micrófono en el navegador.",
      "no-speech": "No te escuché. Intenta nuevamente.",
      "audio-capture": "No se encontró un micrófono disponible.",
      "network": "Error de red al reconocer tu voz.",
      "aborted": "Se canceló la escucha."
    };

    voiceText.textContent =
      errors[event.error] || `Error de micrófono: ${event.error}`;

    voiceText.classList.add("error");

    resetEscucha();

  };

  recognition.onend = () => {

    resetEscucha();

    if (
      !huboResultado &&
      voiceText.textContent === "Te estoy escuchando..."
    ) {
      voiceText.textContent = "No te escuché. Intenta nuevamente.";
    }

  };

  try {

    recognition.start();

  } catch (error) {

    console.error(error);
    resetEscucha();

    voiceText.textContent = "No se pudo iniciar el micrófono.";
    voiceText.classList.add("error");

  }

}

// ==========================================
// EVENTO DEL BOTÓN
// ==========================================

micBtn.addEventListener("click", iniciarEscucha);

</script>
