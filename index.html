
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luci - FINNEX</title>
</head>
<body>

    <main>
        <button id="voiceButton" type="button">
            Iniciar conversación
        </button>

        <p id="status">Luci está esperando.</p>
    </main>

    <script>
        const voiceButton = document.getElementById("voiceButton");
        const statusText = document.getElementById("status");

        let socket = null;
        let microphone = null;
        let recorder = null;
        let active = false;
        let currentAudio = null;

        function setStatus(message) {
            statusText.textContent = message;
        }

        async function startConversation() {
            try {
                setStatus("Solicitando acceso al micrófono...");

                microphone = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }
                });

                const protocol =
                    window.location.protocol === "https:" ? "wss:" : "ws:";

                socket = new WebSocket(
                    `${protocol}//${window.location.host}/ws/luci`
                );

                socket.binaryType = "arraybuffer";

                socket.onopen = () => {
                    active = true;

                    voiceButton.textContent = "Finalizar conversación";
                    setStatus("Luci está escuchando.");

                    socket.send(JSON.stringify({
                        type: "start",
                        language: "es-CO",
                        assistant: "luci",
                        bank: "FINNEX"
                    }));

                    recorder = new MediaRecorder(microphone, {
                        mimeType: "audio/webm;codecs=opus"
                    });

                    recorder.ondataavailable = async (event) => {
                        if (
                            event.data.size > 0 &&
                            socket &&
                            socket.readyState === WebSocket.OPEN
                        ) {
                            const audioData = await event.data.arrayBuffer();
                            socket.send(audioData);
                        }
                    };

                    // Envío continuo de audio al backend.
                    recorder.start(250);
                };

                socket.onmessage = async (event) => {
                    if (typeof event.data !== "string") return;

                    const message = JSON.parse(event.data);

                    if (message.type === "status") {
                        setStatus(message.message);
                    }

                    if (message.type === "audio") {
                        playAudio(message.data, message.mime_type);
                    }

                    if (message.type === "interrupt") {
                        stopAudio();
                    }
                };

                socket.onerror = () => {
                    setStatus("No se pudo conectar con Luci.");
                };

                socket.onclose = () => {
                    if (active) {
                        stopConversation();
                        setStatus("Conexión finalizada.");
                    }
                };

            } catch (error) {
                console.error(error);
                setStatus("No fue posible acceder al micrófono.");
                stopConversation();
            }
        }

        function playAudio(base64Audio, mimeType = "audio/mpeg") {
            stopAudio();

            const binary = atob(base64Audio);
            const bytes = new Uint8Array(binary.length);

            for (let i = 0; i < binary.length; i++) {
                bytes[i] = binary.charCodeAt(i);
            }

            const audioBlob = new Blob([bytes], {
                type: mimeType
            });

            const audioURL = URL.createObjectURL(audioBlob);

            currentAudio = new Audio(audioURL);

            currentAudio.onended = () => {
                URL.revokeObjectURL(audioURL);
                currentAudio = null;
            };

            currentAudio.play().catch(error => {
                console.error("Error reproduciendo audio:", error);
            });
        }

        function stopAudio() {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
                currentAudio = null;
            }
        }

        function stopConversation() {
            active = false;

            stopAudio();

            if (recorder && recorder.state !== "inactive") {
                recorder.stop();
            }

            if (microphone) {
                microphone.getTracks().forEach(track => track.stop());
                microphone = null;
            }

            if (socket) {
                if (socket.readyState === WebSocket.OPEN) {
                    socket.send(JSON.stringify({
                        type: "stop"
                    }));
                    socket.close();
                }

                socket = null;
            }

            recorder = null;
            voiceButton.textContent = "Iniciar conversación";
        }

        voiceButton.addEventListener("click", () => {
            if (active) {
                stopConversation();
                setStatus("Conversación finalizada.");
            } else {
                startConversation();
            }
        });

    </script>

</body>
</html>
