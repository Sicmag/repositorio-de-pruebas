
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luci AI | FINNEX</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root {
    --navy: #102d46;
    --navy-light: #19435b;
    --teal: #13b99a;
    --teal-light: #65e5ca;
    --background: #f3f7fa;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Inter', sans-serif;
    background: var(--background);
    min-height: 100vh;
    overflow: hidden;
}

/* FONDO */

.background {
    position: fixed;
    inset: 0;
    background:
        radial-gradient(circle at 50% 42%, #e2f8f3 0%, transparent 35%),
        linear-gradient(145deg, #f7fafc, #edf4f7);
    z-index: -2;
}

.background::before,
.background::after {
    content: "";
    position: absolute;
    border: 1px solid rgba(19,185,154,.12);
    border-radius: 50%;
}

.background::before {
    width: 650px;
    height: 650px;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%);
}

.background::after {
    width: 850px;
    height: 850px;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%);
}

/* CONTENEDOR */

.app {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    padding: 25px;
}

/* MARCA */

.brand {
    position: absolute;
    top: 32px;
    left: 42px;
    display: flex;
    align-items: center;
    gap: 12px;
}

.brand-icon {
    width: 43px;
    height: 43px;
    background: var(--navy);
    color: var(--teal-light);
    border-radius: 13px;
    display: grid;
    place-items: center;
    font-size: 19px;
}

.brand h2 {
    color: var(--navy);
    font-size: 19px;
    letter-spacing: 1.5px;
}

.brand span {
    display: block;
    font-size: 9px;
    color: #8295a3;
    letter-spacing: 2px;
    margin-top: 4px;
}

/* ROBOT */

.robot-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: -15px;
}

.robot-glow {
    width: 310px;
    height: 310px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(19,185,154,.17), rgba(19,185,154,.02) 65%, transparent 70%);
    display: grid;
    place-items: center;
    position: relative;
}

.robot-glow::before,
.robot-glow::after {
    content: "";
    position: absolute;
    border: 1px solid rgba(19,185,154,.19);
    border-radius: 50%;
    inset: 17px;
    animation: rotate 18s linear infinite;
}

.robot-glow::after {
    inset: 0;
    border-style: dashed;
    opacity: .5;
    animation-direction: reverse;
    animation-duration: 35s;
}

.robot {
    width: 190px;
    height: 190px;
    border-radius: 55px;
    background: linear-gradient(145deg, #183e58, #102b43);
    box-shadow:
        0 25px 55px rgba(16,45,70,.22),
        inset 0 2px 5px rgba(255,255,255,.2);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 2;
    animation: float 4s ease-in-out infinite;
}

.robot-face {
    width: 137px;
    height: 105px;
    border-radius: 35px;
    background: linear-gradient(145deg, #e9fffb, #b9f3e8);
    box-shadow: inset 0 4px 12px rgba(255,255,255,.8);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    position: relative;
}

.robot-face::before {
    content: "";
    position: absolute;
    top: -15px;
    width: 5px;
    height: 18px;
    border-radius: 5px;
    background: var(--teal);
}

.robot-eye {
    width: 13px;
    height: 21px;
    border-radius: 10px;
    background: #087f7b;
    box-shadow: 0 0 13px rgba(19,185,154,.7);
    animation: blink 5s infinite;
}

.robot-mouth {
    position: absolute;
    bottom: 22px;
    width: 23px;
    height: 7px;
    border-radius: 0 0 15px 15px;
    border-bottom: 3px solid #087f7b;
}

.robot-ear {
    position: absolute;
    width: 15px;
    height: 42px;
    border-radius: 8px;
    background: var(--teal);
    top: 74px;
}

.robot-ear.left {
    left: -9px;
}

.robot-ear.right {
    right: -9px;
}

.robot-light {
    position: absolute;
    top: 19px;
    right: 22px;
    width: 9px;
    height: 9px;
    background: #51eac2;
    border-radius: 50%;
    box-shadow: 0 0 15px #51eac2;
}

/* IDENTIDAD LUCI */

.identity {
    text-align: center;
    margin-top: 17px;
}

.identity h1 {
    font-size: 37px;
    color: var(--navy);
    font-weight: 800;
    letter-spacing: -1.5px;
}

.identity p {
    color: #8295a3;
    font-size: 12px;
    margin-top: 8px;
    letter-spacing: 1px;
}

/* ESTADO */

.status {
    margin-top: 35px;
    display: flex;
    align-items: center;
    gap: 9px;
    color: #708795;
    font-size: 12px;
}

.status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--teal);
    box-shadow: 0 0 10px rgba(19,185,154,.5);
}

/* MICROFONO */

.microphone-container {
    margin-top: 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
}

.microphone {
    width: 76px;
    height: 76px;
    border: none;
    border-radius: 50%;
    background: linear-gradient(145deg, #16c5a2, #079b84);
    color: white;
    font-size: 25px;
    cursor: pointer;
    box-shadow:
        0 10px 25px rgba(19,185,154,.3),
        inset 0 2px 4px rgba(255,255,255,.3);
    transition: .25s;
    position: relative;
}

.microphone:hover {
    transform: scale(1.07);
    box-shadow: 0 13px 35px rgba(19,185,154,.4);
}

.microphone.listening {
    animation: pulse 1.5s infinite;
    background: linear-gradient(145deg, #102d46, #1c526a);
}

.microphone-label {
    color: #718795;
    font-size: 11px;
    letter-spacing: .5px;
}

/* PIE */

.footer {
    position: absolute;
    bottom: 25px;
    color: #a0adb7;
    font-size: 10px;
    letter-spacing: .5px;
}

.footer span {
    color: #16a88f;
    font-weight: 700;
}

/* ANIMACIONES */

@keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
}

@keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(19,185,154,.4); }
    70% { box-shadow: 0 0 0 22px rgba(19,185,154,0); }
    100% { box-shadow: 0 0 0 0 rgba(19,185,154,0); }
}

@keyframes rotate {
    to { transform: rotate(360deg); }
}

@keyframes blink {
    0%, 45%, 49%, 100% { transform: scaleY(1); }
    47% { transform: scaleY(.1); }
}

/* MOVIL */

@media(max-width:600px) {
    .brand {
        top: 22px;
        left: 20px;
    }

    .robot-glow {
        width: 270px;
        height: 270px;
    }

    .robot {
        width: 165px;
        height: 165px;
        border-radius: 48px;
    }

    .robot-face {
        width: 120px;
        height: 90px;
    }

    .robot-ear {
        top: 63px;
    }

    .identity h1 {
        font-size: 32px;
    }
}
</style>
</head>

<body>

<div class="background"></div>

<main class="app">

    <header class="brand">
        <div class="brand-icon">
            <i class="fa-solid fa-building-columns"></i>
        </div>

        <div>
            <h2>FINNEX</h2>
            <span>BANKING ECOSYSTEM</span>
        </div>
    </header>

    <section class="robot-area">

        <div class="robot-glow">

            <div class="robot">

                <div class="robot-light"></div>

                <div class="robot-ear left"></div>
                <div class="robot-ear right"></div>

                <div class="robot-face">
                    <div class="robot-eye"></div>
                    <div class="robot-eye"></div>
                    <div class="robot-mouth"></div>
                </div>

            </div>

        </div>

        <div class="identity">
            <h1>Luci</h1>
            <p>INTELIGENCIA ARTIFICIAL FINNEX</p>
        </div>

        <div class="status">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">Estoy aquí para escucharte</span>
        </div>

        <div class="microphone-container">

            <button class="microphone" id="micButton" aria-label="Iniciar conversación">
                <i class="fa-solid fa-microphone"></i>
            </button>

            <span class="microphone-label" id="micLabel">
                Toca para hablar con Luci
            </span>

        </div>

    </section>

    <footer class="footer">
        <span>FINNEX</span> · Tu banco, tu inteligencia
    </footer>

</main>

<script>
const micButton = document.getElementById("micButton");
const statusText = document.getElementById("statusText");
const micLabel = document.getElementById("micLabel");

let microphone = null;
let listening = false;

async function startListening() {
    try {
        microphone = await navigator.mediaDevices.getUserMedia({
            audio: {
                echoCancellation: true,
                noiseSuppression: true,
                autoGainControl: true
            }
        });

        listening = true;

        micButton.classList.add("listening");
        micButton.innerHTML = '<i class="fa-solid fa-microphone-slash"></i>';

        statusText.textContent = "Luci está escuchando...";
        micLabel.textContent = "Toca para finalizar";

    } catch (error) {
        statusText.textContent = "No se pudo acceder al micrófono";
        micLabel.textContent = "Verifica los permisos del navegador";
    }
}

function stopListening() {
    if (microphone) {
        microphone.getTracks().forEach(track => track.stop());
        microphone = null;
    }

    listening = false;

    micButton.classList.remove("listening");
    micButton.innerHTML = '<i class="fa-solid fa-microphone"></i>';

    statusText.textContent = "Estoy aquí para escucharte";
    micLabel.textContent = "Toca para hablar con Luci";
}

micButton.addEventListener("click", () => {
    if (listening) {
        stopListening();
    } else {
        startListening();
    }
});
</script>

</body>
</html>
